[bdist_wheel]
# Pure-Python package that supports both Py2-incompatible 3.9+ only; still, the build is
# not version-specific, so emit a universal-for-py3 tag (py3-none-any).
universal = 0

[tool:pytest]
# src layout: make the package importable without an editable install.
pythonpath = src
testpaths = tests
