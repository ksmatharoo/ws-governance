secret-scopes:
  - name: SCOPE_NAME
    acls:                                  # READ | WRITE | MANAGE
      - group: GROUP_NAME
        permission: MANAGE
      - group: GROUP_NAME
        permission: WRITE
      - service_principal: "00000000-0000-0000-0000-000000000000"
        permission: READ

# Singleton: who may create/use personal access tokens. No name field.
tokens:
  - acls:                                  # CAN_USE | CAN_MANAGE
      - group: GROUP_NAME
        permission: CAN_MANAGE
      - group: GROUP_NAME
        permission: CAN_USE
